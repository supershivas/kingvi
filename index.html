<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#1C1C1E"/>
<title>KINGVI SNO 7</title>
<link rel="icon" href="favicon.ico" sizes="any"/>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&family=DM+Mono:wght@400&family=Grenze+Gotisch:wght@500;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.1/dist/tabler-icons.min.css"/>
<link rel="stylesheet" href="css/style.css?v=1.24.0"/>
<link rel="stylesheet" href="mobile.css?v=1.24.0"/>
<script src="vendor/phaser.min.js"></script>
</head>
<body>

<header class="topbar safe-top">
  <a id="home" class="brand" href="./" title="Revenir au jeu">
    <span class="brand-mark"><i class="ti ti-sword" aria-hidden="true"></i></span>
    <span class="brand-name">KINGVI SNO 7</span>
  </a>
  <div class="topbar-actions">
    <button id="open-settings" class="icon-btn icon-only" type="button" title="Réglages" aria-label="Réglages">
      <i class="ti ti-settings" aria-hidden="true"></i>
    </button>
  </div>
</header>

<div id="desktop-only" class="banner" hidden>
  <span>Cette app est prévue pour un écran d'ordinateur.</span>
  <button id="desktop-only-close" class="icon-btn icon-only" type="button" aria-label="Fermer">
    <i class="ti ti-x" aria-hidden="true"></i>
  </button>
</div>

<main id="screen" class="screen crt">
  <div id="stage" class="stage"></div>
  <div class="tilt soft" aria-hidden="true"><canvas></canvas></div>
  <div class="tilt strong" aria-hidden="true"><canvas></canvas></div>
  <div class="crt-layer" aria-hidden="true"></div>
  <section id="title" class="title-screen" aria-labelledby="title-name">
    <canvas id="title-sea" class="title-sea" aria-hidden="true"></canvas>
    <h1 id="title-name" class="title-name"><span class="visually-hidden">Kingvi Sno 7</span><canvas id="title-art" aria-hidden="true"></canvas></h1>
    <div class="title-actions">
      <button id="title-resume" class="btn-primary" type="button">
        <i class="ti ti-player-play" aria-hidden="true"></i> Reprendre
      </button>
      <button id="title-new" class="btn-ghost" type="button">
        <i class="ti ti-refresh" aria-hidden="true"></i> <span>Nouveau jeu</span>
      </button>
      <button id="title-settings" class="btn-ghost" type="button">
        <i class="ti ti-settings" aria-hidden="true"></i> Réglages
      </button>
    </div>
  </section>
  <div class="vignette" aria-hidden="true"></div>
  <div id="tally" class="tally" hidden>
    <span class="tally-item" title="Arbres abattus"><i class="ti ti-tree" aria-hidden="true"></i> <span id="tally-trees">0</span></span>
    <span class="tally-item" title="Rochers brisés"><i class="ti ti-diamond" aria-hidden="true"></i> <span id="tally-rocks">0</span></span>
  </div>
  <div class="hurt-layer" aria-hidden="true"></div>
  <div id="dpad" class="dpad" hidden aria-hidden="true">
    <i class="ti ti-chevron-up dpad-arrow up"></i>
    <i class="ti ti-chevron-right dpad-arrow right"></i>
    <i class="ti ti-chevron-down dpad-arrow down"></i>
    <i class="ti ti-chevron-left dpad-arrow left"></i>
    <span class="dpad-knob"></span>
  </div>
  <div id="iris" class="iris" hidden aria-hidden="true"></div>
  <p id="hint" class="hint gone">ZQSD pour marcher · Maj pour courir · clic pour frapper · molette pour zoomer un peu</p>
</main>

<dialog id="settings" class="modal" aria-labelledby="settings-title">
  <div class="modal-box">
    <div class="modal-head">
      <h2 id="settings-title">Réglages</h2>
      <button id="close-settings" class="icon-btn icon-only on-light" type="button" aria-label="Fermer">
        <i class="ti ti-x" aria-hidden="true"></i>
      </button>
    </div>

    <button id="new-game" class="btn-ghost" type="button">
      <i class="ti ti-refresh" aria-hidden="true"></i> <span>Nouveau jeu</span>
    </button>

    <div class="field-select">
      <label for="opt-music">Musique</label>
      <input id="opt-music" type="range" min="0" max="100" step="5"/>
    </div>

    <div class="field-select">
      <label for="opt-sfx">Bruitages (corbeaux, épée…)</label>
      <input id="opt-sfx" type="range" min="0" max="100" step="5"/>
    </div>

    <div class="field-select">
      <label for="opt-windvol">Son du vent</label>
      <input id="opt-windvol" type="range" min="0" max="100" step="5"/>
    </div>

    <div class="field-select">
      <label for="opt-quality">Qualité de l'image : <span id="quality-label"></span></label>
      <input id="opt-quality" type="range" min="1" max="4" step="1"/>
      <span class="hint-text" id="quality-about"></span>
    </div>

    <label class="field-select">
      <span>Météo (vent et neige)</span>
      <select id="opt-wind"></select>
      <span class="hint-text" id="wind-about"></span>
    </label>

    <div class="field-select">
      <label for="opt-daytime">Moment de la journée</label>
      <input id="opt-daytime" type="range" min="0" step="1"/>
      <span class="hint-text" id="daytime-label"></span>
      <label class="toggle">
        <input id="opt-dayauto" type="checkbox"/>
        <span>Suivre l'heure réelle</span>
      </label>
    </div>

    <section class="stats" aria-label="Voyage">
      <div><span class="stat-value" id="stat-distance">0</span><span class="stat-label">pas dans la neige</span></div>
    </section>

    <button id="back-to-shore" class="btn-ghost" type="button">
      <i class="ti ti-anchor" aria-hidden="true"></i> Revenir à la barque
    </button>

    <a class="btn-ghost" href="labo.html">
      <i class="ti ti-flask" aria-hidden="true"></i> Labo d'animations
    </a>

    <div class="settings-foot">
      <p class="version" id="version">v…</p>
      <h3 class="section-label">Dernières versions</h3>
      <ol id="changelog" class="changelog"></ol>
      <button id="export" class="btn-primary" type="button">
        <i class="ti ti-download" aria-hidden="true"></i> Exporter les données (JSON)
      </button>
    </div>
  </div>
</dialog>

<div id="toast" class="toast" role="status" hidden></div>

<script type="module" src="js/main.js?v=1.24.0"></script>
</body>
</html>
